server:
  port: 8080

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: app
    password: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

cpf-validation:
  enabled: false #Manteremos false para test. Demais ambientes "chamaríamos" o service validator e deixaríamos true.
  base-url: http://localhost:8089
  timeout-ms: 3000
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics